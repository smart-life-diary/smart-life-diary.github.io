<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --page:#E4D8BD;
    --paper:#F2EAD6;
    --paper-edge:#D8C6A0;
    --ink:#39301F;
    --ink-soft:#7A6A4E;
    --line:#C6B187;
    --gold:#B0863A;
    --arcane:#5C7A6A;
    --seal:#9C4334;
    --seal-soft:#C16A57;
    --f-display:'Kaisei Decol','Yu Mincho',serif;
    --f-hand:'Yusei Magic','Klee One',sans-serif;
    --f-body:'Klee One','Hiragino Maru Gothic ProN',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{
    font-family:var(--f-body);
    color:var(--ink);
    min-height:100dvh;
    background:radial-gradient(120% 80% at 50% 0%,var(--paper) 0%,var(--page) 70%,#D2C19A 100%);
    padding:20px 14px 40px;
    display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:520px}

  .card{
    background:var(--paper);
    border:1px solid var(--paper-edge);
    border-radius:16px;
    padding:22px 20px;
    box-shadow:0 10px 30px rgba(80,60,20,.15), inset 0 0 60px rgba(200,170,110,.12);
  }

  .eyebrow{
    display:inline-block;font-family:var(--f-hand);font-size:13px;color:#fff;
    background:var(--arcane);padding:3px 12px;border-radius:20px;letter-spacing:1px;
  }

  .seal{
    width:64px;height:64px;border-radius:50%;margin:10px auto 0;
    background:radial-gradient(circle at 35% 30%,var(--seal-soft),var(--seal));
    color:#fff8ef;display:flex;align-items:center;justify-content:center;
    font-family:var(--f-display);font-weight:700;font-size:20px;
    box-shadow:0 3px 8px rgba(120,40,30,.35);
    border:2px solid rgba(255,255,255,.35);
    transform:rotate(-8deg);
  }

  h1.title{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.35;margin:10px 0 6px}
  .lead{color:var(--ink-soft);font-size:15px;line-height:1.8;margin:12px 0 4px}
  .lead b{color:var(--ink)}
  .note{color:var(--ink-soft);font-size:13px;margin:8px 0 18px}

  .big-btn{
    width:100%;padding:15px 0;border-radius:12px;border:none;
    background:var(--seal);color:#fff;
    font-family:var(--f-display);font-weight:700;font-size:17px;
    cursor:pointer;transition:all .18s;
    box-shadow:0 5px 14px rgba(120,40,30,.3);
  }
  .big-btn:hover{background:#8a3527}
  .big-btn.ghost{
    background:transparent;color:var(--arcane);
    border:1.5px solid var(--arcane);box-shadow:none;
  }
  .big-btn.ghost:hover{background:rgba(92,122,106,.1)}

  .prog{display:flex;gap:5px}
  .prog i{flex:1;height:6px;border-radius:4px;background:var(--line);opacity:.5;transition:background .25s}
  .prog i.on{background:var(--arcane);opacity:1}

  .qhead{display:flex;align-items:baseline;gap:8px;margin-top:14px}
  .qhead .n{font-family:var(--f-hand);color:var(--seal);font-size:16px}
  .qhead .of{color:var(--ink-soft);font-size:13px}
  h2.qtext{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.5;margin:6px 0 4px}
  .qsub{color:var(--ink-soft);font-size:13.5px;margin:0 0 16px}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;align-items:center;gap:12px;text-align:left;width:100%;
    padding:14px;border-radius:12px;border:1.5px solid var(--line);
    background:#fff;color:var(--ink);
    font-family:var(--f-body);font-size:15.5px;cursor:pointer;
    transition:all .15s;box-shadow:0 1px 0 rgba(0,0,0,.04);
  }
  .opt:hover{border-color:var(--arcane);background:rgba(92,122,106,.10);box-shadow:0 4px 12px rgba(80,60,20,.12)}
  .opt .e{
    font-size:20px;width:38px;height:38px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--page);border-radius:50%;
  }

  .back{
    margin-top:18px;background:none;border:none;color:var(--ink-soft);
    font-family:var(--f-body);font-size:14px;cursor:pointer;text-decoration:underline;
  }

  .res-lead{text-align:center;color:var(--ink-soft);font-size:14px;margin:8px 0 2px}
  h1.res-name{font-family:var(--f-display);font-weight:700;font-size:25px;line-height:1.45;text-align:center;margin:2px 0}
  h1.res-name .sub{font-size:17px;color:var(--seal)}
  .res-copy{font-family:var(--f-hand);text-align:center;color:var(--arcane);font-size:15px;margin:6px 16px 16px;line-height:1.6}
  .radar-wrap{display:flex;justify-content:center;margin:0 0 6px}
  .radar-wrap svg{width:100%;max-width:280px}
  .rarity{text-align:center;font-family:var(--f-hand);color:var(--gold);font-size:15px;margin-bottom:16px}

  .field{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .field .k{flex-shrink:0;width:96px;font-family:var(--f-hand);color:var(--seal);font-size:13.5px;line-height:1.6}
  .field .v{font-size:14px;line-height:1.7}

  .promptbox{
    margin-top:22px;border:1.5px dashed var(--gold);border-radius:12px;
    padding:14px;background:rgba(176,134,58,.07);
  }
  .promptbox .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
  .promptbox .head span{font-family:var(--f-hand);color:var(--seal);font-size:15px}
  .copy-btn{
    background:var(--seal);color:#fff;border:none;border-radius:8px;padding:7px 14px;
    font-family:var(--f-body);font-size:13px;cursor:pointer;transition:background .2s;flex-shrink:0;
  }
  .copy-btn.done{background:var(--arcane)}
  .promptbox p{color:var(--ink-soft);font-size:12.5px;margin:0 0 8px;line-height:1.6}
  .promptbox textarea{
    width:100%;height:150px;resize:vertical;
    border:1px solid var(--line);border-radius:8px;padding:10px;
    font-family:var(--f-body);font-size:12px;line-height:1.6;
    color:var(--ink);background:var(--paper);
  }

  .foot{text-align:center;color:var(--ink-soft);font-size:11px;margin-top:18px;opacity:.8}
  .hidden{display:none}
  .fade{animation:fade .26s ease}
  @keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .fade{animation:none}.opt,.big-btn,.copy-btn,.prog i{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- INTRO -->
  <section id="intro" class="card">
    <div class="eyebrow">異世界転生 鑑定書</div>
    <h1 class="title">ズバリ、<br>あなたの転生先は…</h1>
    <p class="lead">7つの問いに答えると、あなたが異世界に転生したときの<b>職業</b>を、ちょっと失礼なくらい大胆に決めつけます。</p>
    <div class="seal">鑑定</div>
    <p class="note">※結果から、雑誌風ビジュアルを作るための画像生成プロンプトも発行されます。</p>
    <button class="big-btn" id="startBtn">診断をはじめる</button>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="card hidden">
    <div class="prog" id="prog"></div>
    <div class="qhead">
      <span class="n" id="qnum"></span>
      <span class="of" id="qof"></span>
    </div>
    <h2 class="qtext" id="qtext"></h2>
    <p class="qsub" id="qsub"></p>
    <div class="opts" id="opts"></div>
    <button class="back" id="backBtn">← 戻る</button>
  </section>

  <!-- RESULT -->
  <section id="result" class="card hidden">
    <div class="eyebrow">鑑定結果</div>
    <div style="text-align:center;margin:6px 0 2px"><div class="seal">確定</div></div>
    <p class="res-lead">あなたの転生先は…</p>
    <h1 class="res-name" id="resName"></h1>
    <p class="res-copy" id="resCopy"></p>
    <div class="radar-wrap" id="radarWrap"></div>
    <div class="rarity" id="resRarity"></div>
    <div id="fields"></div>

    <div class="promptbox">
      <div class="head">
        <span>画像生成プロンプト</span>
        <button class="copy-btn" id="copyBtn">プロンプトをコピー</button>
      </div>
      <p>これを画像生成AIに貼ると、サンプルのような雑誌風ビジュアルが作れます。</p>
      <textarea id="promptTa" readonly></textarea>
    </div>

    <div style="margin-top:20px">
      <button class="big-btn ghost" id="againBtn">もう一度診断する</button>
    </div>
  </section>

  <p class="foot">※エンタメ診断です。偏見はジョークとしてお楽しみください。</p>
</div>

/* ---------------- スコア計算 ---------------- */
function pickJob(answers){
  const ax={bravery:0,brains:0,gold:0,heart:0,chaos:0};
  answers.forEach(o=>{ if(o) Object.entries(o.sc).forEach(([k,v])=>{ax[k]+=v;}); });
  let best=JOBS[0], bestScore=-1;
  JOBS.forEach(j=>{
    let s=0;
    Object.keys(ax).forEach(k=>{ s+=ax[k]*(j.af[k]||0); });
    if(s>bestScore){ bestScore=s; best=j; }
  });
  return best;
}

〜${j.copy}〜

中央：${j.className}が異世界で${j.centerScene}象徴的なシーンを、ファンタジー/RPG世界のトンマナで大きく配置する。

周囲に以下を雑誌特集風に散りばめる（イラスト・図解優先、文字は最小限）：

/* ---------------- レーダーチャート ---------------- */
const SVG_NS="http://www.w3.org/2000/svg";
function radarSVG(r){
  const labels=[["腕力",r.arm],["知力",r.int],["魔力",r.mag],["カリスマ",r.cha],["運",r.luck],["メンタル",r.men]];
  const cx=130, cy=120, rad=78;
  const pt=(v,i)=>{
    const a=(-90+i*60)*(Math.PI/180);
    const rr=rad*(v/100);
    return [cx+rr*Math.cos(a), cy+rr*Math.sin(a)];
  };
  const ring=f=>labels.map((_,i)=>{
    const a=(-90+i*60)*(Math.PI/180);
    return (cx+rad*f*Math.cos(a))+","+(cy+rad*f*Math.sin(a));
  }).join(" ");

  const css=getComputedStyle(document.documentElement);
  const cLine=css.getPropertyValue("--line").trim();
  const cArcane=css.getPropertyValue("--arcane").trim();
  const cInk=css.getPropertyValue("--ink").trim();

  const svg=document.createElementNS(SVG_NS,"svg");
  svg.setAttribute("viewBox","0 0 260 240");
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","能力レーダーチャート");

  [0.34,0.67,1].forEach(f=>{
    const p=document.createElementNS(SVG_NS,"polygon");
    p.setAttribute("points",ring(f));
    p.setAttribute("fill","none");
    p.setAttribute("stroke",cLine);
    p.setAttribute("stroke-width","1");
    svg.appendChild(p);
  });
  labels.forEach((_,i)=>{
    const [x,y]=pt(100,i);
    const l=document.createElementNS(SVG_NS,"line");
    l.setAttribute("x1",cx); l.setAttribute("y1",cy);
    l.setAttribute("x2",x);  l.setAttribute("y2",y);
    l.setAttribute("stroke",cLine);
    l.setAttribute("stroke-width","1");
    svg.appendChild(l);
  });
  const dataPoly=document.createElementNS(SVG_NS,"polygon");
  dataPoly.setAttribute("points",labels.map(([,v],i)=>pt(v,i).join(",")).join(" "));
  dataPoly.setAttribute("fill",cArcane);
  dataPoly.setAttribute("fill-opacity","0.32");
  dataPoly.setAttribute("stroke",cArcane);
  dataPoly.setAttribute("stroke-width","2");
  svg.appendChild(dataPoly);

  labels.forEach(([name],i)=>{
    const [x,y]=pt(122,i);
    const t=document.createElementNS(SVG_NS,"text");
    t.setAttribute("x",x); t.setAttribute("y",y);
    t.setAttribute("font-size","12");
    t.setAttribute("fill",cInk);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("dominant-baseline","middle");
    t.style.fontFamily="var(--f-hand)";
    t.textContent=name;
    svg.appendChild(t);
  });
  return svg;
}

/* ---------------- 画面制御 ---------------- */
const el = id => document.getElementById(id);
const screens = {intro:el("intro"), quiz:el("quiz"), result:el("result")};

let idx=0;
let answers=new Array(Q.length).fill(null);
let job=null;
let copiedTimer=null;

function show(name){
  Object.entries(screens).forEach(([k,node])=>{
    node.classList.toggle("hidden", k!==name);
  });
  const node=screens[name];
  node.classList.remove("fade"); void node.offsetWidth; node.classList.add("fade");
}

function renderProg(){
  const p=el("prog"); p.innerHTML="";
  for(let i=0;i<Q.length;i++){
    const b=document.createElement("i");
    if(i<=idx) b.className="on";
    p.appendChild(b);
  }
}

function renderQ(){
  renderProg();
  const cur=Q[idx];
  el("qnum").textContent="第"+(idx+1)+"問";
  el("qof").textContent="/ 全"+Q.length+"問";
  el("qtext").textContent=cur.t;
  el("qsub").textContent=cur.s;
  const o=el("opts"); o.innerHTML="";
  cur.o.forEach(opt=>{
    const b=document.createElement("button");
    b.className="opt";
    const e=document.createElement("span");
    e.className="e"; e.textContent=opt.e;
    const l=document.createElement("span");
    l.textContent=opt.l;
    b.appendChild(e); b.appendChild(l);
    b.addEventListener("click",()=>choose(opt));
    o.appendChild(b);
  });
}

function choose(opt){
  answers[idx]=opt;
  if(idx < Q.length-1){
    idx++;
    renderQ();
  } else {
    job=pickJob(answers);
    renderResult();
    show("result");
    window.scrollTo({top:0,behavior:"smooth"});
  }
}

function field(k,v){
  const wrap=document.createElement("div");
  wrap.className="field";
  const kk=document.createElement("div");
  kk.className="k"; kk.textContent=k;
  const vv=document.createElement("div");
  vv.className="v"; vv.textContent=v;
  wrap.appendChild(kk); wrap.appendChild(vv);
  return wrap;
}

function renderResult(){
  const name=el("resName");
  name.textContent=job.name;
  if(job.sub){
    const s=document.createElement("span");
    s.className="sub"; s.textContent=" "+job.sub;
    name.appendChild(s);
  }
  el("resCopy").textContent="〜"+job.copy+"〜";
  el("resRarity").textContent=job.rarity;

  const rw=el("radarWrap"); rw.innerHTML="";
  rw.appendChild(radarSVG(job.radar));

  const f=el("fields"); f.innerHTML="";
  f.appendChild(field("チート能力", job.cheat));
  f.appendChild(field("スキル構成", job.skills));
  f.appendChild(field("パーティーでの役割", job.role));
  f.appendChild(field("弱点", job.weakness));
  f.appendChild(field("最期", job.fate));
  f.appendChild(field("転生してもバレる職業病", job.disease));

  el("promptTa").value=buildPrompt(job);
}

function reset(){
  answers=new Array(Q.length).fill(null);
  idx=0; job=null;
  const btn=el("copyBtn");
  btn.textContent="プロンプトをコピー"; btn.classList.remove("done");
  if(copiedTimer){ clearTimeout(copiedTimer); copiedTimer=null; }
  show("intro");
  window.scrollTo({top:0,behavior:"smooth"});
}

el("startBtn").addEventListener("click",()=>{ idx=0; renderQ(); show("quiz"); });
el("backBtn").addEventListener("click",()=>{
  if(idx>0){ idx--; renderQ(); } else { show("intro"); }
});
el("againBtn").addEventListener("click",reset);

el("promptTa").addEventListener("focus",e=>e.target.select());

el("copyBtn").addEventListener("click",async ()=>{
  const ta=el("promptTa");
  const btn=el("copyBtn");
  const markCopied=()=>{
    btn.textContent="コピーしました！";
    btn.classList.add("done");
    if(copiedTimer) clearTimeout(copiedTimer);
    copiedTimer=setTimeout(()=>{
      btn.textContent="プロンプトをコピー";
      btn.classList.remove("done");
    },1800);
  };
  try{
    await navigator.clipboard.writeText(ta.value);
    markCopied();
  }catch(_){
    // iOS Safari など、クリップボードAPIが使えない場合のフォールバック
    ta.removeAttribute("readonly");
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    try{ document.execCommand("copy"); markCopied(); }catch(__){}
    ta.setAttribute("readonly","");
  }
});
</script>
